<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>St. Ring will hear your confession</title>
<!--
  St. Ring — Confession Quiz — BARE-BONES BUILD (step 2 of the spec)
  Spec: spec_string_2026-11-11_v01.md (repo root)
  Back end: app/api/string/route.ts

  This version proves the flow end to end. Deliberately plain: no chant,
  no smile/halo, no tooth-glint burst, no page turns, no molar, no charts.
  Those come next, one at a time.

  Edit the COPY block to change wording, the TUNING block to change timing.
  The `code` values in COPY must match the codes in route.ts — change the
  labels freely, never the codes.
-->
<style>
  :root {
    --ink: #f3ead7;
    --dim: #9a917f;
    --bg: #0b0907;
    --line: #3a332a;
    --accent: #e8c66a;
  }
  * { box-sizing: border-box; }
  /* ── Static page ──────────────────────────────────────────────────
     The page itself never scrolls or zooms. On iOS Safari the bottom
     toolbar collapses and reappears when the PAGE scrolls; scrolling
     only ever happens inside a screen (the results), so the toolbar
     stays put. touch-action: manipulation kills double-tap zoom; the
     viewport tag and the gesture handler in the script block pinch. */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  * { touch-action: manipulation; }
  [hidden] { display: none !important; }
  /* Fonts (self-hosted so the party wifi can't strand them):
     IM Fell English for anything long; Almendra Bold for short, punchy labels. */
  @font-face { font-family: 'IM Fell English'; src: url(/art/string/fonts/im-fell-english-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'IM Fell English'; src: url(/art/string/fonts/im-fell-english-latin-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Almendra'; src: url(/art/string/fonts/almendra-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
  body {
    position: fixed; inset: 0;
    font: 18px/1.4 'IM Fell English', Georgia, 'Times New Roman', serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  main { position: relative; height: 100%; max-width: 34rem; margin: 0 auto; perspective: 1200px; }
  .screen {
    display: none;
    position: absolute; inset: 0;
    background: var(--bg);
    transform-origin: left center;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    padding: calc(env(safe-area-inset-top) + 1rem) 1.25rem calc(env(safe-area-inset-bottom) + 1rem);
    flex-direction: column;
  }
  .screen.on { display: flex; }
  .screen.scrolls { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: none; }
  .screen.scrolls.on { display: block; }
  /* ── Parchment (the three questions) ───────────────────────────────
     Ink-on-paper colors override the dark theme inside .paper screens.
     Manuscript red replaces gold: gold disappears on paper. The paper
     grain is generated (two layers of SVG noise), so no image loads. */
  .paper {
    --ink: #23170d; --dim: #6b5a44; --line: rgba(90,64,30,0.38);
    --accent: #8e1b14; --on-accent: #f3e6c8; --expl: #4a3a28;
    color: var(--ink);
    background-color: #e9d29a;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0 0.05 0 0 0 0.32 0'/></filter><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.06 0.16' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.27 0 0 0 0 0.08 0 0 0 0.2 0'/></filter><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.008' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.32 0 0 0 0 0.08 0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23b)'/><rect width='100%' height='100%' filter='url(%23f)'/><rect width='100%' height='100%' filter='url(%23a)'/></svg>");
  }
  /* Candlelight over everything: an edge vignette and a slow flicker.
     Strengths live in TUNING. */
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  #fx-black { background: #000; opacity: 0; }
  /* Shading layers inside each screen, driven during a page turn */
  .turn-sh, .turn-dk { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
  h1, h2 { font-weight: normal; line-height: 1.2; }
  h1 { font-size: 1.8rem; text-align: center; margin: 3rem 0 2rem; }
  h2 { font-size: 1.35rem; margin: 0 0 1.25rem; }
  .center { text-align: center; }
  .dim { color: var(--dim); font-size: 0.9rem; }

  /* ── Splash: the icon of St. Ring, built from layers ───────────────
     Canvas is 941 × 1672. The art always fills the screen's width: the
     arch's top piece pins to the top, the banner piece to the bottom, and
     the straight pillars stretch or compress to fit. The saint, halo and
     stars stay anchored to the banner. Positions live in ART (script). */
  .splash { padding: 0; background: #000; }
  .art { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .art .ly { position: absolute; display: block; pointer-events: none; }
  .art .grp { position: absolute; inset: 0; pointer-events: none; }
  .art .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art .eyes {
    -webkit-mask-image: var(--eye-mask); mask-image: var(--eye-mask);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  }
  .art .eyes img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .eb { position: absolute; top: 0; width: 100%; height: 100%; background-size: 100% 100%; background-repeat: no-repeat; }
  .art .bloom { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
  .art .framegrp { position: absolute; inset: 0; pointer-events: none; }
  .art .framegrp img { position: absolute; display: block; }
  /* The banner is the button. Pressing it brightens the cartouche. */
  .art .banner-glow {
    position: absolute; pointer-events: none; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(ellipse at center, rgba(255,240,190,0.9) 0%, rgba(255,222,150,0.45) 40%, rgba(255,200,120,0) 72%);
    transition: opacity 140ms ease-out;
  }
  .art .banner-hit {
    position: absolute; display: grid; place-items: center; text-align: center; cursor: pointer;
    font-family: 'Almendra', 'IM Fell English', serif; font-style: normal; font-weight: 700; color: #4a120c; line-height: 1.1;
    pointer-events: auto; -webkit-tap-highlight-color: transparent;
    transition: text-shadow 140ms ease-out, color 140ms ease-out;
  }
  .art.pressed .banner-glow { opacity: 1; }
  .art.pressed .banner-hit { color: #6e1d10; text-shadow: 0 0 calc(var(--u) * 14px) rgba(255, 244, 205, 0.95); }

  /* Placeholder for the St. Ring image (stand-in) */
  .saint {
    width: 10rem; height: 12rem; margin: 2rem auto 0;
    border: 1px dashed var(--line); border-radius: 50% 50% 0.5rem 0.5rem;
    display: grid; place-items: center; color: var(--dim); font-size: 0.85rem;
  }

  /* Question I is heaven (top) and hell (bottom). These two slots are
     reserved for the marginalia; heights live in TUNING. */
  .margin-top, .margin-bottom { flex: none; position: relative; margin: 0 -0.75rem; }
  /* Illustrations are painted on white: multiply drops the white out so the
     ink sits on the parchment like a real manuscript page. */
  .illum-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; pointer-events: none; }
  .margin-top    { height: var(--margin-top, 12%); }
  .margin-bottom { height: var(--margin-bottom, 12%); }
  /* Questions I and III fill exactly one screen: the answers share
     whatever height is left, so nothing ever scrolls. */
  .fit h2 { flex: none; font-size: clamp(1rem, 2.6vh, 1.35rem); margin: 0 0 0.6rem; text-align: center; }
  /* Illuminated initial: the letter is the picture, the rest of the word
     follows straight on, left-aligned. */
  .paper h2.capped { display: flex; align-items: center; text-align: left; white-space: pre-line; }
  .paper h2.capped .cap { flex: none; height: 2.9em; width: auto; margin-right: 0.15em; mix-blend-mode: multiply; }
  .fit .choices { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.35rem; margin: 0; }
  .fit .choices li { flex: 1; min-height: 0; max-height: 4.5rem; margin: 0; display: flex; }
  .fit .choice {
    display: grid; grid-template-columns: 2.1rem 6rem 1fr; gap: 0.55rem;
    padding: 0.25rem 0.7rem; align-items: center;
  }
  .fit .choice .box { margin-top: 0; }
  .choice b { font-size: clamp(0.95rem, 2.5vh, 1.15rem); line-height: 1.1; }
  .choice i { font-size: clamp(0.72rem, 1.8vh, 0.85rem); line-height: 1.2; color: var(--expl, var(--dim)); }
  .fit .actions { flex: none; margin-top: 0.6rem; }
  .fit .status { flex: none; min-height: 1.2rem; margin-top: 0.4rem; }

  /* Checkbox lists (Questions I and III) */
  .choices { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  .choices li { margin: 0 0 0.5rem; }
  .choice {
    width: 100%; display: flex; gap: 0.75rem; align-items: flex-start;
    padding: 0.75rem 0.85rem; text-align: left;
    background: none; color: inherit; font: inherit;
    border: 1px solid var(--line); border-radius: 0.4rem; cursor: pointer;
  }
  /* Illuminated checkbox art (both states share one footprint so nothing shifts) */
  .choice .box {
    flex: none; width: 2.1rem; height: 1.65rem; margin-top: 0;
    background: url(/art/string/illum/check_off.webp) center / contain no-repeat;
    mix-blend-mode: multiply;
  }
  .choice.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .choice.on .box { background-image: url(/art/string/illum/check_on.webp); }
  .choice b, .ends, button.btn, .molar-slider .thumb .num { font-family: 'Almendra', 'IM Fell English', Georgia, serif; font-weight: 700; font-style: normal; }

  /* Question II — the molar slider.
     Every element has a fixed size so nothing shifts as the value changes:
     the number lives inside the tooth, the end labels sit in fixed cells. */
  #s-q2 .illumination { flex: 1; min-height: 0; position: relative; margin-top: 0.5rem; }
  .illum-caption { flex: none; text-align: center; font-style: italic; font-size: 0.85rem; color: var(--expl, var(--dim)); margin-top: 0.3rem; }
  #s-q2 .illumination img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  #s-q2 h2 { flex: none; font-size: clamp(1.1rem, 3vh, 1.45rem); text-align: left; white-space: pre-line; margin: 0.5rem 0 0.75rem; }
  .molar-slider {
    flex: none; position: relative; height: 80px; margin: 0.25rem 0 0;
    cursor: pointer; outline: none; touch-action: none;
    --thumb-w: 66px;
  }
  /* Ornate gold track: positioned in JS so its 11 diamonds sit under scores 0–10.
     The score colour fills the channel behind the (multiplied) artwork. */
  .molar-slider .track {
    position: absolute; left: var(--tl, 0px); width: var(--tw, 100%); height: var(--th, 30px);
    top: calc(40px - var(--th, 30px) * 0.5);
  }
  .molar-slider .track .fill {
    position: absolute; left: 5.6%; right: 5.6%; top: 39.4%; height: 21.1%; border-radius: 999px;
    background: var(--track, #9c7a8f); transition: background-color 120ms linear;
  }
  .molar-slider .track img {
    position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none;
  }
  .molar-slider .thumb {
    position: absolute; top: 7px; left: 0; width: var(--thumb-w); height: var(--thumb-w);
    transform: translateX(var(--x, 0px));
    filter: drop-shadow(0 2px 3px rgba(40,20,0,0.4));
  }
  .molar-slider .thumb img { display: block; width: 100%; height: 100%; pointer-events: none; }
  .molar-slider .thumb .num {
    position: absolute; left: 0; right: 0; top: 23%; text-align: center;
    font-size: 0.92rem; font-weight: bold; line-height: 1; color: #6e0f0f; font-variant-numeric: tabular-nums;
  }
  /* Untouched: no number, track and medallion faded until the first touch */
  /* (filter sits on the pieces, not the .track wrapper, so the art still multiplies onto the parchment) */
  .molar-slider.inactive .track img,
  .molar-slider.inactive .track .fill { filter: grayscale(1); opacity: 0.45; }
  .molar-slider.inactive .thumb img { filter: grayscale(1) brightness(1.15) contrast(0.6); }
  .molar-slider.inactive .num { visibility: hidden; }
  .ends {
    flex: none; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;
    height: 1.3rem; font-size: 0.72rem; line-height: 1.3; white-space: nowrap; color: var(--expl, var(--dim));
    transition: opacity 150ms;
  }
  .ends.inactive { opacity: 0.4; }
  .ends span:nth-child(2) { text-align: center; }
  .ends span:nth-child(3) { text-align: right; }
  /* Buttons sit at the very bottom of every question page, always in the
     same place: each screen ends with its .actions row. */
  .paper .actions { flex: none; margin-top: 0.75rem; }

  /* Buttons */
  .actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
  button.btn {
    flex: 1; padding: 0.9rem 1rem; font-size: inherit; line-height: inherit; cursor: pointer;
    border-radius: 0.4rem; border: 1px solid var(--accent);
    background: var(--accent); color: var(--on-accent, var(--bg));
  }
  button.btn.ghost { background: none; color: var(--ink); border-color: var(--line); }
  button.btn:disabled { opacity: 0.3; cursor: default; }
  .solo { display: block; width: 100%; max-width: 20rem; margin: 2rem auto 0; }

  /* ── Results ─────────────────────────────────────────────────────
     Donut for Question I (tap a slice: its share + name appear in the
     center), a single proportional strip for Question II, and a toggle
     between everyone and the five generations. The penitent's own
     answers are marked in gold. */
  .res-title { margin: 0.25rem 0 0.9rem; font-family: 'Almendra', 'IM Fell English', serif; font-weight: 700; font-size: 1.9rem; letter-spacing: 0.01em; }
  .res-title::before, .res-title::after { content: '✠'; color: var(--accent); font-size: 0.6em; vertical-align: 0.3em; margin: 0 0.45em; }
  .seg-toggle { display: flex; margin: 0 auto 0.75rem; width: max-content; border: 1.5px solid var(--ink); border-radius: 0.35rem; overflow: hidden; }
  .seg-toggle button { font-family: 'Almendra', serif; font-weight: 700; font-size: 0.9rem; padding: 0.4rem 1rem; background: none; border: 0; color: var(--ink); cursor: pointer; }
  .seg-toggle button + button { border-left: 1.5px solid var(--ink); }
  .seg-toggle button.on { background: var(--accent); color: var(--on-accent); }
  .gen-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem; margin: 0 0 0.5rem; }
  .gen-chips[hidden] { display: none; }
  .gen-chips button { font-family: 'Almendra', serif; font-weight: 700; font-size: 0.78rem; padding: 0.25rem 0.6rem; border-radius: 0.3rem; border: 1px solid var(--line); background: none; color: var(--dim); cursor: pointer; }
  .gen-chips button.on { border-color: var(--ink); color: var(--ink); background: rgba(90,64,30,0.12); }
  .gen-chips button.mine { color: var(--accent); }
  .gen-chips button.mine.on { border-color: var(--accent); }
  .donut-wrap { position: relative; width: min(72vw, 15rem); aspect-ratio: 1; margin: 0.25rem auto 1rem; }
  #donut { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 2px 2px rgba(60,35,10,0.3)); }
  #donut .slice { cursor: pointer; transition: opacity 150ms, transform 150ms; stroke: #23170d; stroke-width: 1.6; stroke-linejoin: round; }
  #donut .ring-rule { fill: none; stroke: #23170d; stroke-width: 1.2; }
  #donut .ring-gold { fill: none; stroke: #c9a24a; stroke-width: 2.5; }
  #donut .slice.dim { opacity: 0.25; }
  #donut .mine-arc { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; pointer-events: none; }
  .donut-center {
    position: absolute; inset: 30%; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; cursor: pointer;
  }
  .donut-center .pct { font-family: 'Almendra', serif; font-weight: 700; font-size: 2rem; line-height: 1; }
  .donut-center .lbl { font-size: 0.9rem; font-style: italic; color: var(--dim); margin-top: 0.2rem; }
  .donut-center .lbl.mine { color: var(--accent); }
  .donut-center img { width: 100%; height: auto; }
  .strip-title { font-size: 1rem; font-style: italic; color: var(--expl); text-align: center; margin: 0 0 0.6rem; }
  .strip-row { margin: 0 0 0.15rem; }
  .strip-row .gen-label { font-family: 'Almendra', serif; font-weight: 700; font-size: 0.8rem; color: var(--ink); margin: 0 0 0.25rem; }
  .strip-row.mine .gen-label { color: var(--accent); }
  /* The strip is framed like the slider's channel: ink rule inside a gold band */
  .strip { position: relative; display: flex; height: 16px; border-radius: 999px; overflow: hidden; background: rgba(90,64,30,0.15);
    border: 1.5px solid #23170d; box-shadow: 0 0 0 2.5px #c9a24a, 0 0 0 3.6px #23170d; margin: 4px 4px 0; }
  .strip.big { height: 26px; }
  .strip i { display: block; height: 100%; }
  .strip i + i { box-shadow: inset 1.5px 0 0 #23170d; }
  .strip-marker { position: relative; height: 0.8rem; margin: 3px 4px 0; }
  .strip-marker span {
    position: absolute; top: 1px; transform: translateX(-50%);
    width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 9px solid var(--accent);
  }
  .strip-ends { display: flex; justify-content: space-between; gap: 1rem; font-family: 'Almendra', serif; font-weight: 700; font-size: 0.78rem; color: var(--expl); margin-top: 0.15rem; }
  .res-count { margin: 0.6rem 0 0; font-style: italic; font-size: 0.95rem; color: var(--expl); }
  section { margin: 0 0 2rem; }
  .status { min-height: 1.4rem; margin-top: 1rem; text-align: center; color: var(--dim); font-size: 0.9rem; }
  .badge { display: inline-block; font-size: 0.75rem; padding: 0.15rem 0.5rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 1rem; }
</style>
</head>
<body>
<main id="stage">
  <div class="fx" id="fx-vignette"></div>
  <div class="fx" id="fx-flicker"></div>
  <div class="fx" id="fx-black"></div>
  <div class="fx" id="fx-white" style="background:#fff;opacity:0"></div>

  <!-- SPLASH — first visit -->
  <div class="screen splash" id="s-splash">
    <div class="art" id="art-splash"></div>
  </div>

  <!-- SPLASH — return visit -->
  <div class="screen splash" id="s-return">
    <div class="art" id="art-return"></div>
  </div>

  <!-- QUESTION I -->
  <div class="screen fit paper" id="s-q1">
    <h2 id="q1-title"></h2>
    <div class="margin-top"><img class="illum-img" src="/art/string/illum/heaven.webp" alt=""></div>
    <ul class="choices" id="q1-list"></ul>
    <div class="margin-bottom"><img class="illum-img" src="/art/string/illum/hell.webp" alt=""></div>
    <div class="actions">
      <button class="btn" id="b-q1-next" disabled>Confess</button>
    </div>
  </div>

  <!-- QUESTION II -->
  <div class="screen paper" id="s-q2">
    <h2 id="q2-title"></h2>
    <div class="molar-slider inactive" id="q2-slider" role="slider" tabindex="0"
         aria-valuemin="0" aria-valuemax="10" aria-label="Score from 0 to 10">
      <div class="track"><div class="fill"></div><img src="/art/string/illum/track.webp" alt=""></div>
      <div class="thumb">
        <img src="/art/string/illum/medallion.webp" alt="">
        <div class="num" id="q2-num"></div>
      </div>
    </div>
    <div class="ends inactive" id="q2-ends"></div>
    <div class="illumination"><img src="/art/string/illum/martyr.webp" alt=""></div>
    <div class="illum-caption">The martyrdom of St. Ring</div>
    <div class="actions">
      <button class="btn ghost" id="b-q2-back">Recant</button>
      <button class="btn" id="b-q2-next" disabled>Confess</button>
    </div>
  </div>

  <!-- QUESTION III -->
  <div class="screen fit paper" id="s-q3">
    <h2 id="q3-title"></h2>
    <ul class="choices" id="q3-list"></ul>
    <div class="status" id="submit-status"></div>
    <div class="actions">
      <button class="btn ghost" id="b-q3-back">Recant</button>
      <button class="btn" id="b-q3-next" disabled>Final Confession</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen scrolls paper" id="s-results">
    <h2 class="center res-title">The Reckoning <span class="badge" id="interviewer-badge" hidden>Interviewer</span></h2>
    <div class="seg-toggle" id="res-toggle">
      <button type="button" data-mode="all" class="on">All</button>
      <button type="button" data-mode="gen">By generation</button>
    </div>
    <div class="gen-chips" id="gen-chips" hidden></div>
    <div class="donut-wrap">
      <svg id="donut" viewBox="-110 -110 220 220" aria-label="How oft the faithful floss"></svg>
      <div class="donut-center" id="donut-center"></div>
    </div>
    <div class="strip-title" id="strip-title"></div>
    <div id="strips"></div>
    <p class="dim center res-count" id="res-count"></p>
    <button class="btn solo" id="b-next-penitent" hidden>Next penitent</button>
  </div>

</main>

<script>
// ═══ COPY ══════════════════════════════════════════════════════════════
// Change any wording here. Never change a `code` — route.ts depends on them.

  perspective: 1200,       // camera distance in px; lower = more 3D

// The device ID lives in the browser. If storage is blocked (some private
// modes), we still get an ID for this visit — it just won't survive a reload.
function deviceId() {
  let id = null
  try { id = localStorage.getItem(TUNING.storageKey) } catch {}
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID()
      : 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12))
    try { localStorage.setItem(TUNING.storageKey, id) } catch {}
  }
  return id
}

// ═══ PAGE TURN ═════════════════════════════════════════════════════════
// Forward: the current page swings away on a spine at the left edge,
// darkening as it goes, and its shadow sweeps across the page beneath.
// Back (Recant): the previous page swings back in, the same in reverse.
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2

function turnFrame(page, under, k) {
  const deg = 95 * k
  const rad = Math.min(deg, 90) * Math.PI / 180
  const sn = Math.sin(rad)
  page.style.transform = `rotateY(${-deg}deg)`
  const edge = Math.max(0, Math.cos(rad)) * 100
  const pen = TUNING.shadowSoftness * (0.25 + sn)
  const str = TUNING.castShadow * Math.pow(1 - k, 0.8)   // fades to nothing by the end — no pop
  under.querySelector('.turn-sh').style.background = str < 0.002 ? 'none'
    : `linear-gradient(to right, rgba(30,14,0,${str}) 0%, rgba(30,14,0,${str}) ${edge}%, rgba(30,14,0,0) ${edge + pen}%)`
  page.querySelector('.turn-dk').style.background =
    `linear-gradient(to left, rgba(15,6,0,${TUNING.pageDarken * Math.pow(sn, 1.3)}), rgba(15,6,0,${TUNING.pageDarken * 0.6 * Math.pow(sn, 1.3)}))`
}

function animate(ms, f) {
  return new Promise(res => {
    const t0 = performance.now()
    const frame = now => {
      const k = Math.min(1, (now - t0) / ms)
      f(easeInOut(k))
      if (k < 1) requestAnimationFrame(frame); else res()
    }
    requestAnimationFrame(frame)
  })
}

function clearTurn(el) {
  el.style.transform = ''
  el.style.zIndex = ''
  el.querySelector('.turn-sh').style.background = 'none'
  el.querySelector('.turn-dk').style.background = 'none'
}

async function go(name, dir) {
  if (turning || name === currentScreen) return
  if (!currentScreen) return show(name)
  turning = true
  $('stage').style.pointerEvents = 'none'
  const out = $('s-' + currentScreen)
  const inc = $('s-' + name)

  if (TUNING.transition === 'dip') {
    const blk = $('fx-black')
    const half = TUNING.dipMs / 2
    await blk.animate([{ opacity: 0 }, { opacity: 1 }], { duration: half, easing: 'ease-in-out', fill: 'forwards' }).finished
    show(name)
    await new Promise(r => setTimeout(r, TUNING.dipHoldMs))
    await blk.animate([{ opacity: 1 }, { opacity: 0 }], { duration: half, easing: 'ease-in-out', fill: 'forwards' }).finished
  } else {
    inc.classList.add('on')
    enter(name)                      // lay out the incoming page (tooth position etc.)
    if (dir > 0) {
      out.style.zIndex = 2; inc.style.zIndex = 1
      await animate(TUNING.turnMs, k => turnFrame(out, inc, k))
    } else {
      inc.style.zIndex = 2; out.style.zIndex = 1
      turnFrame(inc, out, 1)
      await animate(TUNING.turnMs, k => turnFrame(inc, out, 1 - k))
    }
    out.classList.remove('on')
    clearTurn(out); clearTurn(inc)
  }
  $('stage').style.pointerEvents = ''
  turning = false
}

// ═══ CANDLELIGHT ═══════════════════════════════════════════════════════
function startCandle() {
  const a = TUNING.vignette
  $('fx-vignette').style.boxShadow = `inset 0 0 ${30 + 70 * a}px ${10 + 30 * a}px rgba(20,8,0,${0.25 + 0.6 * a})`
  const fl = $('fx-flicker')
  const t0 = performance.now()
  const frame = now => {
    const t = (now - t0) / 1000
    const n = 0.5 * Math.sin(t * 7.3) + 0.3 * Math.sin(t * 13.1 + 1.7) + 0.2 * Math.sin(t * 23.7 + 0.4) + 0.25 * (Math.random() - 0.5)
    fl.style.background = `rgba(25,10,0,${Math.max(0, TUNING.flicker * (0.5 + 0.5 * n))})`
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
}


// ═══ SPLASH ═══════════════════════════════════════════════════════════
// Layer placement in canvas pixels (941 × 1672). Nudge any number here.
const ASSET = '/art/string/splash/'
const ART = {
  W: 941, H: 1672,
  halo:   { x: 165,    y: 190,    w: 618,   h: 611 },
  saint:  { x: 0,      y: 293,    w: 934,   h: 1245 },
  eyes:   { x: 408.3,  y: 473.8,  w: 216.6, h: 72.2 },
  smile:  { x: 484.18, y: 601.74, w: 67.94, h: 18.92 },   // teeth cut from the saint layer: they line up exactly
  banner: { x: 200,    y: 1462,   w: 541,   h: 100 },     // text area, centred on the cartouche
  bannerGlow: { x: 150, y: 1430, w: 641, h: 165 },
  frame: { top: 502, bottom: 320 },                        // piece heights; the pillars fill the rest
  // Stars: centre x, centre y, size, which art (1 or 2). They travel with the halo.
  stars: [[351,174,70,1],[585,174,70,2],[186,306,80,2],[762,306,80,1],[114,555,95,1],[816,555,95,2],[153,672,85,2],[750,720,90,1]],
  eyeCentreL: -6.95, eyeCentreR: 7.0,   // centre the pupils (the eyeball art is drawn cross-eyed)
}

const clamp = (x, a, b) => Math.max(a, Math.min(b, x))
const ramp = (t, a, d) => clamp((t - a) / Math.max(d, 0.001), 0, 1)

function makeSplash(host, caption, lit) {
  host.style.setProperty('--eye-mask', `url(${ASSET}eye_whites.webp)`)
  const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; (parent || host).appendChild(e); return e }
  const img = (src, cls, parent) => { const i = el('img', 'ly ' + (cls || ''), parent); i.src = ASSET + src; i.alt = ''; i.decoding = 'async'; return i }
  const grp = () => el('div', 'grp')

  const G = { bg: grp(), halo: grp(), saint: grp() }
  img('bg.webp', 'bgimg', G.bg)
  const halo = img('halo.webp', '', G.halo)
  const saint = img('saint.webp', '', G.saint)
  const eyes = el('div', 'ly eyes', G.saint)
  eyes.innerHTML = `<img src="${ASSET}eye_whites.webp" alt="">
    <div class="eb" style="left:${ART.eyeCentreL}%;background-image:url(${ASSET}eyeballs.webp);clip-path:inset(0 50% 0 0)"></div>
    <div class="eb" style="left:${ART.eyeCentreR}%;background-image:url(${ASSET}eyeballs.webp);clip-path:inset(0 0 0 50%)"></div>`
  const pupils = eyes.querySelectorAll('.eb')
  const bloom = el('div', 'bloom'); host.insertBefore(bloom, G.saint)    // halo glow sits behind him, never on his face
  G.stars = grp()
  const stars = ART.stars.map(([x, y, sz, n], i) => ({ el: img(`star${n}.webp`, '', G.stars), x, y, sz, seed: i * 1.7 + 0.3 }))
  const frame = el('div', 'framegrp')
  const fTop = img('frame_top.webp', '', frame), fSides = img('frame_sides.webp', '', frame), fBot = img('frame_bottom.webp', '', frame)
  const glow = el('div', 'banner-glow', frame)
  const banner = el('div', 'banner-hit', frame); banner.textContent = caption
  const smileG = grp()
  const smile = img('smile_saint.webp', '', smileG)
  for (const g of [G.halo, G.saint, G.stars, smileG]) g.style.transformOrigin = '50% 100%'

  const S = { host, banner, ready: false, t0: performance.now() - (lit ? 60000 : 0), u: 1, extra: 0, offX: 0, fitS: 1, cur: { x: 0, y: 0 } }

  S.layout = () => {
    const W = host.clientWidth, H = host.clientHeight
    if (!W || !H) return
    let u = W / ART.W, offX = 0
    if (H < (ART.frame.top + ART.frame.bottom + 250) * u) { u = H / ART.H; offX = (W - ART.W * u) / 2 }   // landscape fallback
    const extra = H - ART.H * u
    // On short screens the saint, halo and stars scale down from the bottom so his head clears the arch
    const fitS = extra < 0 ? Math.max(0.6, 1 + extra / ((ART.H - ART.halo.y) * u)) : 1
    Object.assign(S, { u, offX, extra, fitS })
    host.style.setProperty('--u', u)
    const put = (e, r) => {
      e.style.left = (offX + r.x * u) + 'px'; e.style.top = (r.y * u + extra) + 'px'
      e.style.width = (r.w * u) + 'px'; e.style.height = (r.h * u) + 'px'
    }
    put(halo, ART.halo); put(saint, ART.saint); put(eyes, ART.eyes); put(smile, ART.smile)
    put(banner, ART.banner); put(glow, ART.bannerGlow); banner.style.fontSize = (52 * u) + 'px'
    stars.forEach(s => put(s.el, { x: s.x - s.sz / 2, y: s.y - s.sz / 2, w: s.sz, h: s.sz }))
    const H2 = ART.H * u + extra, fw = ART.W * u
    for (const im of [fTop, fSides, fBot]) { im.style.left = offX + 'px'; im.style.width = fw + 'px' }
    fTop.style.top = '0px'; fTop.style.height = (ART.frame.top * u) + 'px'
    fBot.style.top = (H2 - ART.frame.bottom * u) + 'px'; fBot.style.height = (ART.frame.bottom * u) + 'px'
    fSides.style.top = (ART.frame.top * u - 1) + 'px'; fSides.style.height = (H2 - (ART.frame.top + ART.frame.bottom) * u + 2) + 'px'
    const hx = offX + (ART.halo.x + ART.halo.w / 2) * u
    const hy = H2 - (H2 - ((ART.halo.y + ART.halo.h / 2) * u + extra)) * fitS
    bloom.style.background = `radial-gradient(circle at ${hx}px ${hy}px, rgba(255,214,120,.9) 0%, rgba(255,190,80,.35) ${150 * u}px, rgba(255,170,60,0) ${420 * u}px)`
  }

  S.restart = () => { S.t0 = performance.now(); S.ready = false }

  S.tick = now => {
    const C = TUNING.splash, t = (now - S.t0) / 1000, u = S.u
    const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
    const s1 = 0.3, s2 = s1 + C.starsAt, s3 = Math.max(s1 + C.grinIn, s2 + C.starsBuild * 0.85)
    const L = C.lightDur, tSky = s3 + C.stagger, tSaint = s3 + 2 * C.stagger, tFrame = s3 + 2.5 * C.stagger

    // 1 · the grin — a touch warm, handing over to the painted smile as he's lit
    const g = C.grinGlow
    smile.style.filter = `sepia(0.35) brightness(0.92) drop-shadow(0 0 ${6 * u * g + 0.01}px rgba(255,240,200,${0.9 * g})) drop-shadow(0 0 ${18 * u * g + 0.01}px rgba(255,220,150,${0.5 * g}))`
    smile.style.opacity = ease(ramp(t, s1, C.grinIn)) * (1 - ease(ramp(t, tSaint + L * C.handOffAt, C.handOffDur)))

    // 2 · stars build around it, then float, wiggle and twinkle
    stars.forEach((s, i) => {
      const k = ease(ramp(t, s2 + i * (C.starsBuild / stars.length), C.starsBuild * 0.5))
      const tw = 1 + C.starTwinkle * (0.5 * Math.sin(t * (2.1 + (i % 3) * 0.7) + s.seed * 3) + 0.3 * Math.sin(t * 5.3 + s.seed * 7))
      s.el.style.opacity = k
      s.el.style.filter = `brightness(${Math.max(0.3, tw).toFixed(3)})`
      const dx = Math.sin(t * 0.5 + s.seed) * C.starFloat * 0.6 * u, dy = Math.cos(t * 0.37 + s.seed * 1.3) * C.starFloat * 0.6 * u
      const rot = Math.sin(t * 0.3 + s.seed) * C.starFloat * 0.6 + Math.sin(t * 0.9 + s.seed * 2) * C.starWiggle
      s.el.style.transform = `translate(${dx.toFixed(2)}px, ${(dy + (1 - k) * 8 * u).toFixed(2)}px) scale(${(0.6 + 0.4 * k).toFixed(3)}) rotate(${rot.toFixed(2)}deg)`
    })

    // 3 · lit from behind: the halo flares (he's a silhouette against it),
    //     then the sky, then bounce light warms the saint, then the arch
    const kH = ease(ramp(t, s3, L))
    G.halo.style.filter = `brightness(${(kH * (1 + C.haloOvershoot * Math.sin(Math.PI * Math.min(1, ramp(t, s3, L * 1.8))))).toFixed(3)})`
    G.bg.style.filter = `brightness(${ease(ramp(t, tSky, L)).toFixed(3)})`
    const kS = ease(ramp(t, tSaint, L * 1.3))
    G.saint.style.filter = `brightness(${kS.toFixed(3)}) sepia(${(0.55 * Math.sin(Math.PI * kS)).toFixed(3)}) saturate(${(1 + 0.3 * Math.sin(Math.PI * kS)).toFixed(3)})`
    const kF = ease(ramp(t, tFrame, L))
    frame.style.filter = `brightness(${kF.toFixed(3)}) sepia(${(0.4 * Math.sin(Math.PI * kF)).toFixed(3)})`
    bloom.style.opacity = C.bloom * (Math.sin(Math.PI * ramp(t, s3, L * 2.2)) * 0.8 + 0.2 * kH)
    S.ready = t > tFrame + L * 0.6

    // Slow wandering viewpoint: layers drift by depth, the eyes glance with the body
    const w = now / 1000
    const target = { x: 0.55 * Math.sin(w * 0.45) * Math.sin(w * 0.17 + 1), y: 0.35 + 0.45 * Math.sin(w * 0.31 + 2) }
    const sm = 1 / C.smoothing
    S.cur.x += (target.x - S.cur.x) * sm; S.cur.y += (target.y - S.cur.y) * sm
    for (const [k, gr] of Object.entries(G)) {
      const d = C.depth[k], sc = k === 'bg' ? 1.04 : 1.04 * S.fitS
      gr.style.transform = `translate(${(-S.cur.x * C.parallax * d * u).toFixed(2)}px, ${(-S.cur.y * C.parallax * d * u).toFixed(2)}px) scale(${sc.toFixed(4)})`
    }
    smileG.style.transform = G.saint.style.transform
    const er = C.eyeRange
    pupils.forEach(p => p.style.transform = `translate(${(-S.cur.x * er).toFixed(2)}%, ${(-Math.min(0.4, S.cur.y) * er * 1.1).toFixed(2)}%)`)
  }

  // Press: the cartouche brightens; release: page turn onward
  banner.addEventListener('pointerdown', () => { if (S.ready) host.classList.add('pressed') })
  banner.addEventListener('pointerleave', () => host.classList.remove('pressed'))
  banner.addEventListener('pointercancel', () => host.classList.remove('pressed'))
  banner.addEventListener('pointerup', () => {
    const wasPressed = host.classList.contains('pressed')
    setTimeout(() => host.classList.remove('pressed'), 180)
    if (wasPressed && S.ready && S.onEnter) S.onEnter()
  })
  return S
}

// One loop drives whichever splash is on screen
const SPLASHES = []
function splashLoop(now) {
  for (const S of SPLASHES) if (S.host.closest('.screen').classList.contains('on')) S.tick(now)
  requestAnimationFrame(splashLoop)
}
addEventListener('resize', () => SPLASHES.forEach(S => S.layout()))

// ═══ ILLUMINATED CAPITALS ════════════════════════════════════════════
// A question's first letter is drawn as an illuminated initial when one
// exists for it; otherwise it stays plain text. Add letters here.
const CAPS = { H: '/art/string/illum/cap_h.webp', O: '/art/string/illum/cap_o.webp' }
function setTitle(el, title) {
  const first = title.charAt(0).toUpperCase()
  el.innerHTML = ''
  if (CAPS[first]) {
    el.classList.add('capped')
    const im = document.createElement('img'); im.className = 'cap'; im.src = CAPS[first]; im.alt = first
    const tx = document.createElement('span'); tx.textContent = title.slice(1)
    el.append(im, tx)
  } else {
    el.textContent = title
  }
}

// ═══ CHECKBOX LISTS (I and III) ═══════════════════════════════════════
// One choice at most: tap to select, tap again to clear, tap another to switch.
function buildChoices(listEl, options, field, nextBtn) {
  new Image().src = '/art/string/illum/check_on.webp'   // preload so the first tick is instant
  listEl.innerHTML = ''
  for (const opt of options) {
    const li = document.createElement('li')
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'choice'
    btn.dataset.code = opt.code
    btn.innerHTML = `<span class="box"></span><b>${opt.label}</b><i>${opt.line}</i>`
    btn.addEventListener('click', () => {
      answers[field] = answers[field] === opt.code ? null : opt.code
      listEl.querySelectorAll('.choice').forEach(b =>
        b.classList.toggle('on', b.dataset.code === answers[field]))
      nextBtn.disabled = !answers[field]
    })
    li.appendChild(btn)
    listEl.appendChild(li)
  }
}

function resetQuestions() {
  answers.q1 = answers.q2 = answers.gen = null
  document.querySelectorAll('.choice').forEach(b => b.classList.remove('on'))
  $('b-q1-next').disabled = true
  $('b-q3-next').disabled = true
  resetSlider()
  $('b-q2-next').disabled = true
  $('submit-status').textContent = ''
}

// ═══ MOLAR SLIDER (II) ════════════════════════════════════════════════
// 0–10. The tooth starts at 5 with no number, faded, and Confess locked.
// The first touch (a tap on the tooth counts, even at 5) wakes it up.
//
// Track color by score: dark red → bright red (0–4), mauve at 5,
// purple → very light blue (6–10). Edit the stops here.
const SCORE_COLORS = [
  '#4a0a0a', '#6e0f0f', '#951818', '#bd2320', '#e0302a',   // 0–4  hell
  '#9c7a8f',                                                 // 5    the tolerable middle
  '#8a4fc4', '#7f7ad6', '#86a5e3', '#b3d2f0', '#e2f3ff',   // 6–10 heaven
]
let q2Pos = TUNING.q2Start   // where the tooth sits (shown even before activation)

function placeTooth(v) {
  const el = $('q2-slider')
  const thumbW = el.querySelector('.thumb').offsetWidth
  const travel = el.clientWidth - thumbW
  el.style.setProperty('--x', `${(v / 10) * travel}px`)
  // Scale the track art so diamond 0 and diamond 10 sit under the medallion's centre at 0 and 10
  const TW = 2073, TH = 205, D0 = 170.5, D10 = 1903.5
  const ws = travel * TW / (D10 - D0)
  el.style.setProperty('--tw', `${ws}px`)
  el.style.setProperty('--th', `${ws * TH / TW}px`)
  el.style.setProperty('--tl', `${thumbW / 2 - D0 * ws / TW}px`)
  el.style.setProperty('--track', SCORE_COLORS[v])
  el.setAttribute('aria-valuenow', v)
}

function setScore(v) {
  v = Math.max(0, Math.min(10, Math.round(v)))
  q2Pos = v
  answers.q2 = v
  $('q2-slider').classList.remove('inactive')
  $('q2-ends').classList.remove('inactive')
  $('q2-num').textContent = v
  $('b-q2-next').disabled = false
  placeTooth(v)
}

function resetSlider() {
  q2Pos = TUNING.q2Start
  $('q2-slider').classList.add('inactive')
  $('q2-ends').classList.add('inactive')
  $('q2-num').textContent = ''
  placeTooth(q2Pos)
}

function wireSlider() {
  const el = $('q2-slider')
  let dragging = false
  const valueAt = clientX => {
    const r = el.getBoundingClientRect()
    const thumbW = el.querySelector('.thumb').offsetWidth
    const t = (clientX - r.left - thumbW / 2) / (r.width - thumbW)
    return t * 10
  }
  el.addEventListener('pointerdown', e => {
    dragging = true
    el.setPointerCapture(e.pointerId)
    // A tap on the tooth itself keeps its value; a tap on the track jumps there.
    const onThumb = e.target.closest('.thumb')
    setScore(onThumb ? q2Pos : valueAt(e.clientX))
  })
  el.addEventListener('pointermove', e => { if (dragging) setScore(valueAt(e.clientX)) })
  const stop = () => { dragging = false }
  el.addEventListener('pointerup', stop)
  el.addEventListener('pointercancel', stop)
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setScore(q2Pos - 1); e.preventDefault() }
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setScore(q2Pos + 1); e.preventDefault() }
  })
  // Keep the tooth in the right spot if the phone rotates
  window.addEventListener('resize', () => placeTooth(q2Pos))
}

// ═══ SUBMIT ═══════════════════════════════════════════════════════════
const sleep = ms => new Promise(r => setTimeout(r, ms))

async function submit() {
  const btn = $('b-q3-next')
  const status = $('submit-status')
  btn.disabled = true
  $('b-q3-back').disabled = true
  const body = JSON.stringify({ device: DEVICE, q1: answers.q1, q2: answers.q2, gen: answers.gen, key: KEY || undefined })

  for (let attempt = 0; attempt <= TUNING.submitRetries; attempt++) {
    status.textContent = attempt === 0
      ? 'Thy confession ascendeth…'
      : 'The way is obscured. Trying again…'
    try {
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body })
      const data = await res.json().catch(() => ({}))
      if (res.ok && data.ok) {
        mine = data.mine
        renderResults(data.results)
        await go('results', 1)
        status.textContent = ''
        $('b-q3-back').disabled = false
        return
      }
      if (res.status === 409) {           // this phone already confessed
        mine = data.mine
        renderResults(data.results)
        await go('results', 1)
        status.textContent = ''
        $('b-q3-back').disabled = false
        return
      }
      if (res.status === 400) {           // bad data — retrying won't help
        status.textContent = 'St. Ring could not read thy confession. Recant and try again.'
        break
      }
      // 500 or other: fall through to retry
    } catch {
      // network failure: retry
    }
    if (attempt < TUNING.submitRetries) await sleep(TUNING.submitRetryBaseMs * 2 ** attempt)
  }
  if (!status.textContent.startsWith('St. Ring could not')) {
    status.textContent = 'The heavens are silent. Find a better signal and press again.'
  }
  btn.disabled = false
  $('b-q3-back').disabled = false
}

// ═══ RESULTS ══════════════════════════════════════════════════════════
function labelOf(list, code) {
  const o = list.find(x => x.code === code)
  return o ? o.label : code
}
// Question I colors: heaven (light blue) to hell (dark red), matching
// the slider palette. Keyed by answer code.
const Q1_COLORS = {
  twice: '#e2f3ff', daily: '#86a5e3', often: '#8a4fc4', weekly: '#9c7a8f',
  monthly: '#e0302a', seldom: '#951818', never: '#4a0a0a',
}
const MOLAR_PATH = 'M18,12 C18,4 30,2 38,8 C44,12 56,12 62,8 C70,2 82,4 82,12 C88,30 86,48 80,58 C76,66 74,80 70,98 C68,106 60,106 58,96 C56,84 54,74 50,74 C46,74 44,84 42,96 C40,106 32,106 30,98 C26,80 24,66 20,58 C14,48 12,30 18,12 Z'

let lastResults = null
let resMode = 'all'        // 'all' | 'gen'
let resGen = null          // which generation the donut shows in 'gen' mode
let selSlice = null        // tapped Question I answer code, or null

const pct = (n, total) => total ? Math.round((n / total) * 100) : 0

function arcPath(a0, a1, r0, r1) {
  // angles in radians, 0 = 12 o'clock, clockwise
  const pt = (a, r) => [Math.sin(a) * r, -Math.cos(a) * r]
  const large = a1 - a0 > Math.PI ? 1 : 0
  const [x0, y0] = pt(a0, r1), [x1, y1] = pt(a1, r1)
  const [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0)
  return `M${x0},${y0} A${r1},${r1} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${large} 0 ${x3},${y3} Z`
}
function arcLine(a0, a1, r) {
  const pt = a => [Math.sin(a) * r, -Math.cos(a) * r]
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1)
  return `M${x0},${y0} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1},${y1}`
}

function drawDonut(q1Counts, total, myCode) {
  const svg = $('donut')
  const R_OUT = 96, R_IN = 62
  let html = ''
  if (!total) {
    html = `<path d="${arcPath(0, Math.PI * 2 - 0.0001, R_IN, R_OUT)}" fill="var(--line)"/>`
  } else {
    let a = 0
    for (const o of COPY.q1.options) {
      const n = q1Counts[o.code] || 0
      if (!n) continue
      const sweep = (n / total) * Math.PI * 2
      const a1 = a + sweep
      const mid = a + sweep / 2
      const pop = selSlice === o.code ? 6 : 0
      const dx = Math.sin(mid) * pop, dy = -Math.cos(mid) * pop
      const cls = 'slice' + (selSlice && selSlice !== o.code ? ' dim' : '')
      const d = sweep >= Math.PI * 2 - 0.001 ? arcPath(0, Math.PI * 2 - 0.0001, R_IN, R_OUT) : arcPath(a, a1, R_IN, R_OUT)
      html += `<path class="${cls}" data-code="${o.code}" d="${d}" fill="${Q1_COLORS[o.code]}" transform="translate(${dx},${dy})"/>`
      // The penitent's own slice: a gold arc just outside the ring
      if (o.code === myCode) {
        const inset = Math.min(0.03, sweep * 0.15)
        html += `<path class="mine-arc" d="${arcLine(a + inset, a1 - inset, R_OUT + 7)}" transform="translate(${dx},${dy})"/>`
      }
      a = a1
    }
  }
  // Manuscript rules: a thin gold band with ink edges hugging the ring
  html = `<circle class="ring-gold" r="${R_OUT + 3}"/><circle class="ring-rule" r="${R_OUT + 4.6}"/><circle class="ring-rule" r="${R_IN - 1}"/>` + html
  svg.innerHTML = html

  // Center: a tooth at rest; the tapped slice's share and name when selected
  const c = $('donut-center')
  if (selSlice) {
    const opt = COPY.q1.options.find(o => o.code === selSlice)
    const n = q1Counts[selSlice] || 0
    c.innerHTML = `<div class="pct">${pct(n, total)}%</div><div class="lbl${selSlice === myCode ? ' mine' : ''}">${opt.label}</div>`
  } else {
    c.innerHTML = `<img src="/art/string/illum/medallion.webp" alt="">`
  }
}

// A single proportional strip: each score's width is its share of the
// total, colored by score — the alien-quiz look.
function stripHTML(dist, myScore, big) {
  const total = dist.reduce((a, b) => a + b, 0)
  let bar = ''
  let marker = ''
  if (total) {
    let before = 0
    dist.forEach((n, score) => {
      if (!n) { return }
      bar += `<i style="flex:${n};background:${SCORE_COLORS[score]}"></i>`
      if (score === myScore) marker = `<span style="left:${((before + n / 2) / total) * 100}%"></span>`
      before += n
    })
  }
  return `<div class="strip${big ? ' big' : ''}">${bar}</div><div class="strip-marker">${marker}</div>`
}

function renderResults(r) {
  if (r) lastResults = r
  r = lastResults
  if (!r) return
  const myQ1 = mine && mine.q1
  const myScore = mine ? mine.q2 : null
  const myGen = mine && mine.gen

  // Generation chips (only in 'gen' mode); the penitent's own starts selected
  if (resMode === 'gen' && !resGen) resGen = myGen || 'boomer'
  const chips = $('gen-chips')
  chips.hidden = resMode !== 'gen'
  chips.innerHTML = COPY.q3.options.map(g =>
    `<button type="button" data-gen="${g.code}" class="${g.code === resGen ? 'on' : ''}${g.code === myGen ? ' mine' : ''}">${g.label}</button>`
  ).join('')

  // Donut: everyone, or the chosen generation
  const group = resMode === 'gen' ? r.byGen[resGen] : r
  drawDonut(group.q1, group.total, resMode === 'gen' && resGen !== myGen ? null : myQ1)

  // Question II strips
  $('strip-title').textContent = 'How the holy thread resteth upon the soul'
  let strips = ''
  if (resMode === 'all') {
    strips = stripHTML(r.q2.dist, myScore, true)
  } else {
    for (const g of COPY.q3.options) {
      const gr = r.byGen[g.code]
      const isMine = g.code === myGen
      strips += `<div class="strip-row${isMine ? ' mine' : ''}"><div class="gen-label">${g.label} · ${gr.total}</div>${stripHTML(gr.q2.dist, isMine ? myScore : null, false)}</div>`
    }
  }
  strips += `<div class="strip-ends"><span>0 · ${COPY.q2.left}</span><span>${COPY.q2.right} · 10</span></div>`
  $('strips').innerHTML = strips

  const n = group.total
  $('res-count').textContent = `${n} ${n === 1 ? 'confession' : 'confessions'} heard${resMode === 'gen' ? ' from ' + labelOf(COPY.q3.options, resGen) : ''}`
}

function wireResults() {
  $('res-toggle').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    resMode = b.dataset.mode
    selSlice = null
    $('res-toggle').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b))
    renderResults()
  })
  $('gen-chips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    resGen = b.dataset.gen
    selSlice = null
    renderResults()
  })
  $('donut').addEventListener('click', e => {
    const sl = e.target.closest('.slice'); if (!sl) return
    selSlice = selSlice === sl.dataset.code ? null : sl.dataset.code
    renderResults()
  })
  $('donut-center').addEventListener('click', () => { if (selSlice) { selSlice = null; renderResults() } })
}

async function fetchResults() {
  try {
    const res = await fetch(`${API}?device=${encodeURIComponent(DEVICE)}`, { cache: 'no-store' })
    if (!res.ok) return null
    return await res.json()
  } catch { return null }
}

function startPolling() {
  stopPolling()
  pollTimer = setInterval(async () => {
    const data = await fetchResults()
    if (data) {
      if (!INTERVIEWER && data.mine) mine = data.mine
      renderResults(data.results)
    }
  }, TUNING.resultsRefreshMs)
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null } }

// ═══ WIRING ═══════════════════════════════════════════════════════════
function init() {
  const sp = makeSplash($('art-splash'), 'Enter the Confessional', false)
  const rt = makeSplash($('art-return'), 'Behold the Reckoning', true)
  sp.onEnter = () => go('q1', 1)          // chant will start here later
  rt.onEnter = () => go('results', 1)
  SPLASHES.push(sp, rt)
  requestAnimationFrame(splashLoop)
  document.querySelectorAll('.screen').forEach(sc => {
    sc.insertAdjacentHTML('beforeend', '<div class="turn-sh"></div><div class="turn-dk"></div>')
  })
  $('stage').style.perspective = TUNING.perspective + 'px'
  startCandle()
  document.documentElement.style.setProperty('--margin-top', TUNING.q1MarginTop)
  document.documentElement.style.setProperty('--margin-bottom', TUNING.q1MarginBottom)
  setTitle($('q1-title'), COPY.q1.title)
  setTitle($('q2-title'), COPY.q2.title)
  setTitle($('q3-title'), COPY.q3.title)
  $('q2-ends').innerHTML = `<span>${COPY.q2.left}</span><span>${COPY.q2.middle}</span><span>${COPY.q2.right}</span>`
  buildChoices($('q1-list'), COPY.q1.options, 'q1', $('b-q1-next'))
  buildChoices($('q3-list'), COPY.q3.options, 'gen', $('b-q3-next'))

  wireSlider()
  wireResults()

  $('b-q1-next').addEventListener('click', () => go('q2', 1))
  $('b-q2-back').addEventListener('click', () => go('q1', -1))
  $('b-q2-next').addEventListener('click', () => go('q3', 1))
  $('b-q3-back').addEventListener('click', () => go('q2', -1))
  $('b-q3-next').addEventListener('click', submit)
  $('b-next-penitent').addEventListener('click', () => { mine = null; selSlice = null; resGen = null; resetQuestions(); show('q1') })

  if (INTERVIEWER) {
    $('interviewer-badge').hidden = false
    $('b-next-penitent').hidden = false
  }
}

// Show a splash screen, lay it out now that it's visible, and start its clock
function showSplash(name) {
  show(name)
  const S = SPLASHES[name === 'splash' ? 0 : 1]
  S.layout()
  if (name === 'splash') S.restart()
}

async function start() {
  init()
  if (INTERVIEWER) { showSplash('splash'); return }    // interviewer always starts fresh

  // Guests: has this phone confessed already?
  const data = await fetchResults()
  if (data && data.confessed) {
    mine = data.mine
    renderResults(data.results)
    showSplash('return')
  } else {
    if (data) renderResults(data.results)
    showSplash('splash')
  }
}

start()
</script>
